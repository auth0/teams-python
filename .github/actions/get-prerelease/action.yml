name: Return a boolean indicating if the version contains prerelease identifiers

#
# Returns a simple true/false boolean indicating whether the version indicates it's a prerelease or not.
# Recognizes both the PEP 440 short form (a/b/rc, e.g. "1.0.0b0") used by this repo's .version file
# and the hyphenated long form (alpha/beta) used by other Auth0 Python SDKs.
#
# TODO: Remove once the common repo is public.
#

inputs:
  version:
    required: true

outputs:
  prerelease:
    value: ${{ steps.get_prerelease.outputs.PRERELEASE }}

runs:
  using: composite

  steps:
    - id: get_prerelease
      shell: bash
      run: |
        if [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ || "${VERSION}" == *"alpha"* || "${VERSION}" == *"beta"* ]]; then
          echo "PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "PRERELEASE=false" >> $GITHUB_OUTPUT
        fi
      env:
        VERSION: ${{ inputs.version }}
